name: Build and Release App

on:
  push:
    tags:
      - 'v*' # Trigger when pushing a tag like v2.0.11.2
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Custom Syncthing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Apply Overlay to Submodule
        run: |
          git submodule update --init --recursive
          cp -r overlay/* syncthing-android-source/
          echo "Overlay successfully applied!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Android Home paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build Application APKs
        run: |
          cd syncthing-android-source
          git config --global --add safe.directory '*'
          # Build native libraries and compile debug APKs
          ./gradlew --no-daemon buildNative assembleDebug

      - name: Find and Package Built APKs
        run: |
          mkdir build-output
          # Copy only the arm64-v8a debug APK into build-output directory
          find syncthing-android-source/app/build/outputs/apk/debug/ -name "*arm64-v8a*.apk" -exec cp {} build-output/ \;
          ls -la build-output/

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
