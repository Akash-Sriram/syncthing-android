name: Auto Update Submodule

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update Submodule Pointer
        run: |
          git submodule update --remote --recursive

      - name: Commit and Push Updates
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add syncthing-android-source
          
          # Only commit and push if the submodule pointer changed
          if git diff --cached --quiet; then
            echo "Submodule is already up to date."
          else
            git commit -m "chore: Auto-update syncthing-android-source submodule to latest upstream commit"
            git push origin main
          fi
