name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Upstream and Sync
        run: |
          git remote add upstream https://github.com/researchxxl/syncthing-android.git
          git fetch upstream main
          
          # Merge changes from upstream/main into the current branch (main)
          # --no-edit accepts default merge commit message automatically
          git merge upstream/main --no-edit
          
          # Push to the origin repository's main branch
          git push origin main
